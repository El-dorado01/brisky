name: brisky

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brisky-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: brisky
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brisky"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brisky-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional factory worker. Local default remains `pnpm dev:worker`.
  # Start with: docker compose --profile factory up --build
  worker:
    profiles: ["factory"]
    image: brisky/media-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: brisky-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IS_WORKER: "true"
      RUN_WORKER_IN_API: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/brisky
    # Zero-Shared-Disk: worker uses isolated scratch space; communicates via Postgres + Redis.
    volumes:
      - factory-scratch:/app/storage/scratch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  factory-scratch:
